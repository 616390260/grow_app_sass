<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="16" fill="#4285F4"/>
  
  <!-- Sun -->
  <circle cx="150" cy="50" r="20" fill="#FBBC05"/>
  
  <!-- Characters -->
  <!-- First person -->
  <g transform="translate(60, 120)">
    <circle cx="0" cy="-30" r="15" fill="#34A853"/>
    <path d="M-25,-15 C-30,10 -15,30 0,30 C15,30 30,10 25,-15 L20,-5 C15,20 5,25 0,25 C-5,25 -15,20 -20,-5 Z" fill="#EA4335"/>
    <line x1="-10" y1="-40" x2="0" y2="-60" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-40" x2="0" y2="-60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Second person -->
  <g transform="translate(100, 110)">
    <circle cx="0" cy="-30" r="15" fill="#FBBC05"/>
    <path d="M-25,-15 C-30,10 -15,30 0,30 C15,30 30,10 25,-15 L20,-5 C15,20 5,25 0,25 C-5,25 -15,20 -20,-5 Z" fill="#34A853"/>
    <line x1="-10" y1="-40" x2="-20" y2="-60" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-40" x2="20" y2="-60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Third person -->
  <g transform="translate(140, 125)">
    <circle cx="0" cy="-30" r="15" fill="#EA4335"/>
    <path d="M-25,-15 C-30,10 -15,30 0,30 C15,30 30,10 25,-15 L20,-5 C15,20 5,25 0,25 C-5,25 -15,20 -20,-5 Z" fill="#FBBC05"/>
    <line x1="-10" y1="-40" x2="-15" y2="-60" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-40" x2="15" y2="-60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Coins -->
  <circle cx="110" cy="75" r="8" fill="#FBBC05"/>
  <path d="M110,67 L110,83 M97,82 L123,82 M97,78 L123,78 M97,74 L123,74" stroke="white" stroke-width="1" stroke-linecap="round"/>
</svg>