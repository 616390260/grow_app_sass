<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- 确保在web浏览器上正确显示手机样式 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="taskgo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Loading...</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0A0F1E 0%, #0F172A 50%, #162033 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .gold-spinner {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .gold-spinner .arc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #CA8A04;
      animation: gold-spin 2.4s linear infinite;
      filter: drop-shadow(0 0 6px rgba(202,138,4,0.4));
    }
    .gold-spinner .arc:nth-child(2) {
      inset: 10px;
      border-top-color: transparent;
      border-right-color: rgba(232,185,74,0.5);
      animation-duration: 3.2s;
      animation-direction: reverse;
      border-width: 1.5px;
    }
    .gold-spinner .core {
      position: absolute;
      top: 50%; left: 50%;
      width: 8px; height: 8px;
      margin: -4px 0 0 -4px;
      background: #E8B94A;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(202,138,4,0.4), 0 0 32px rgba(232,185,74,0.2);
      animation: gold-pulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes gold-spin { to { transform: rotate(360deg); } }
    @keyframes gold-pulse {
      from { transform: scale(0.8); opacity: 0.6; }
      to   { transform: scale(1.2); opacity: 1; }
    }
    .loading-text {
      margin-top: 40px;
      font-size: 11px;
      color: #6B7280;
      letter-spacing: 2px;
      font-weight: 300;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="gold-spinner">
      <div class="arc"></div>
      <div class="arc"></div>
      <div class="core"></div>
    </div>
    <div class="loading-text">Loading...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
